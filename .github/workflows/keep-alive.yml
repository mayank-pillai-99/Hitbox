name: Keep API awake

# Render's free tier puts the API to sleep after about 15 minutes without traffic, and the first
# request afterwards takes up to a minute. A ping every 10 minutes keeps it warm.
#
# Notes:
# - GitHub may delay scheduled runs by a few minutes, which is fine for this.
# - GitHub disables scheduled workflows after 60 days without repository activity.
#   If that happens, push any commit (or press "Enable workflow" in the Actions tab).
# - One free Render service running all month uses about 720 of the 750 free hours.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API health check
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 20 https://hitbox-b83d.onrender.com/health
